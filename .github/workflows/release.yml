name: Build and release BOCCHI

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_type == 'branch' && github.ref_name || github.ref }}

      - name: Bump patch version
        if: >-
          github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          github.actor != 'github-actions[bot]' &&
          !contains(github.event.head_commit.message, '[skip version bump]')
        shell: bash
        run: |
          VERSION="$(python3 .github/scripts/bump-patch-version.py)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "AUTO_RELEASE=true" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BOCCHI/BOCCHI.csproj repo.json
          git diff --cached --check
          git commit -m "Bump version to ${VERSION} [skip version bump]"

      - name: Verify version metadata
        shell: bash
        run: |
          PROJECT_VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' BOCCHI/BOCCHI.csproj | head -1)"
          REPO_VERSION="$(python3 -c 'import json; print(json.load(open("repo.json", encoding="utf-8"))[0]["AssemblyVersion"])')"
          if [[ "$REPO_VERSION" != "$PROJECT_VERSION.0" ]]; then
            echo "Repository version $REPO_VERSION does not match project version $PROJECT_VERSION" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$PROJECT_VERSION" != "$TAG_VERSION" ]]; then
              echo "Project version $PROJECT_VERSION does not match tag $TAG_VERSION" >&2
              exit 1
            fi
          fi

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud API
        run: |
          curl --fail --location --retry 3 \
            https://goatcorp.github.io/dalamud-distrib/latest.zip \
            --output /tmp/dalamud.zip
          unzip -q /tmp/dalamud.zip -d "$DALAMUD_HOME"

      - name: Restore
        run: dotnet restore ./BOCCHI/BOCCHI.csproj -p:Configuration=Release

      - name: Build release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' BOCCHI/BOCCHI.csproj | head -1)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          dotnet build ./BOCCHI.sln -c Release --no-restore \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$VERSION.0" \
            -p:FileVersion="$VERSION.0"

      - name: Verify and checksum package
        shell: bash
        run: |
          test -f BOCCHI/bin/Release/BOCCHI/latest.zip
          cp BOCCHI/bin/Release/BOCCHI/latest.zip latest.zip
          sha256sum latest.zip > latest.zip.sha256
          unzip -l latest.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: BOCCHI-${{ env.VERSION }}
          path: |
            latest.zip
            latest.zip.sha256

      - name: Push version commit and tag
        if: env.AUTO_RELEASE == 'true'
        shell: bash
        run: |
          git tag "v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}" "v${VERSION}"

      - name: Create GitHub release
        if: github.ref_type == 'tag' || env.AUTO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BOCCHI ${{ env.VERSION }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            latest.zip
            latest.zip.sha256
