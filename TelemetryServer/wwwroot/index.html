<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新月岛北征之章点位图</title>
  <link rel="stylesheet" href="./site.css?v=20260729-zoom1">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">OCCULT CRESCENT COMMUNITY DATA</p>
        <h1>新月岛北征之章点位图</h1>
        <p class="warning">极度不稳定 · 随时更新 · 谨慎使用</p>
      </div>
      <span id="health" class="health">正在连接</span>
    </header>

    <section class="privacy">
      这里只展示用户主动同意后上传的游戏内容坐标。服务不会收集角色名、CID、账号、
      服务器、聊天内容或玩家实时位置。
    </section>

    <section class="panel controls">
      <label class="map-picker">游戏地图
        <select id="mapSelect" aria-label="选择游戏地图"></select>
      </label>
      <div class="map-identity">
        <span>Territory <strong id="territory">—</strong></span>
        <span>Map <strong id="map">—</strong></span>
        <span id="mapResource">—</span>
      </div>
      <button id="refresh">刷新点位</button>
    </section>

    <section class="grid">
      <article class="panel plot-panel">
        <div class="panel-title">
          <h2 id="mapTitle">游戏地图点位</h2>
          <span>真实客户端地图 · 右侧可逐类开关 · 悬停查看详情</span>
        </div>
        <div class="map-stage">
          <canvas id="plot"></canvas>
          <div class="zoom-controls" aria-label="地图缩放">
            <button id="zoomOut" type="button" title="缩小">−</button>
            <button id="zoomReset" type="button" title="重置缩放"><span id="zoomLevel">100%</span></button>
            <button id="zoomIn" type="button" title="放大">+</button>
          </div>
        </div>
        <div id="tooltip" class="tooltip" hidden></div>
      </article>

      <article class="panel">
        <div class="panel-title"><h2>类型统计与显示开关</h2></div>
        <div id="kinds" class="kinds"></div>
      </article>
    </section>

    <section class="panel table-panel">
      <div class="panel-title"><h2>最近聚合点位</h2><span>最多显示 500 条</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>类型</th><th>Territory / Map</th><th>名称 / ID</th><th>坐标 X, Y, Z</th><th>独立来源</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
    <p class="map-note">地图纹理由本地 FFXIV 客户端导出，仅用于插件点位采集、校准与社区资料整理。</p>
  </main>
  <script src="./site.js?v=20260729-zoom1"></script>
</body>
</html>
