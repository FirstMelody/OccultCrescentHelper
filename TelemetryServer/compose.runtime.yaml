services:
  bocchi-telemetry:
    image: mcr.microsoft.com/dotnet/aspnet:8.0-bookworm-slim
    container_name: bocchi-telemetry
    restart: unless-stopped
    working_dir: /app
    command: ["dotnet", "BOCCHI.TelemetryServer.dll"]
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      BOCCHI_DATA_DIR: "/data"
      BOCCHI_IP_HASH_SECRET: "${BOCCHI_IP_HASH_SECRET:?set BOCCHI_IP_HASH_SECRET in TelemetryServer/.env}"
      BOCCHI_MIN_REPORTERS: "2"
      BOCCHI_DAILY_UNIQUE_MARKER_LIMIT: "1500"
    ports:
      - "127.0.0.1:8787:8080"
    volumes:
      - ./publish:/app:ro
      - ./data:/data
